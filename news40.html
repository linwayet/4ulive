<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Units 4–6</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDF6EC;
  --card: #FFFAF3;
  --amber: #E07B2A;
  --amber-light: #F5A04A;
  --rust: #C0472B;
  --gold: #D4A017;
  --sage: #7A8C6E;
  --cream: #F9EDD8;
  --border: #E8D5B0;
  --text: #2E1F0A;
  --muted: #7A6045;
  --tag-bg: #FDE8C8;
  --tag-text: #8B3A0F;
  --phrase-bg: #FFF0E0;
  --phrase-border: #F5C88A;
  --ex-bg: #FFF8EE;
  --shadow: 0 2px 12px rgba(180,100,20,0.10);
  --u4: #E07B2A;
  --u5: #C0472B;
  --u6: #7A5C2A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #C0472B 0%, #E07B2A 50%, #D4A017 100%);
  padding: 28px 20px 20px;
  text-align: center;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 20px rgba(180,60,20,0.25);
}
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  color: #fff;
  letter-spacing: 0.03em;
  text-shadow: 0 2px 8px rgba(0,0,0,0.18);
}
header p { color: rgba(255,255,255,0.85); font-size: 0.82rem; margin-top: 4px; }

/* TABS */
.tabs {
  display: flex;
  gap: 8px;
  padding: 14px 16px 0;
  background: var(--cream);
  border-bottom: 2px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  padding: 9px 20px;
  border-radius: 10px 10px 0 0;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  background: rgba(255,255,255,0.5);
  color: var(--muted);
  transition: all 0.2s;
  border-bottom: 3px solid transparent;
}
.tab-btn.active {
  background: var(--card);
  color: var(--amber);
  border-color: var(--amber);
  box-shadow: 0 -2px 8px rgba(224,123,42,0.10);
}
.tab-btn:hover { background: #fff; }

/* SEARCH */
.search-wrap {
  padding: 14px 16px 0;
  background: var(--bg);
}
.search-wrap input {
  width: 100%;
  padding: 10px 16px;
  border-radius: 24px;
  border: 1.5px solid var(--border);
  background: #fff;
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem;
  color: var(--text);
  outline: none;
  transition: border 0.2s;
}
.search-wrap input:focus { border-color: var(--amber); }

/* MAIN */
main { padding: 14px 12px 40px; }
.unit-panel { display: none; }
.unit-panel.active { display: block; }

.unit-label {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  color: var(--amber);
  margin: 12px 0 10px;
  padding-left: 4px;
  border-left: 4px solid var(--amber);
  padding-left: 10px;
}

/* CARD */
.card {
  background: var(--card);
  border-radius: 16px;
  border: 1.5px solid var(--border);
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow 0.2s;
}
.card:hover { box-shadow: 0 4px 20px rgba(180,100,20,0.16); }

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px 10px;
  cursor: pointer;
  user-select: none;
}
.word-num {
  min-width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--amber);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  margin-top: 2px;
  flex-shrink: 0;
}
.word-main { flex: 1; }
.word-en {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.word-pos {
  display: inline-block;
  font-size: 0.7rem;
  background: var(--tag-bg);
  color: var(--tag-text);
  border-radius: 6px;
  padding: 1px 7px;
  margin-left: 6px;
  font-weight: 700;
  vertical-align: middle;
}
.word-zh {
  font-size: 0.88rem;
  color: var(--muted);
  margin-top: 3px;
  font-weight: 600;
}
.toggle-icon {
  font-size: 1.1rem;
  color: var(--amber);
  margin-top: 4px;
  transition: transform 0.25s;
  flex-shrink: 0;
}
.card.open .toggle-icon { transform: rotate(180deg); }

.card-body {
  display: none;
  padding: 0 16px 14px;
  border-top: 1px dashed var(--border);
  margin-top: 2px;
  padding-top: 12px;
}
.card.open .card-body { display: block; }

/* DERIVATIVE / PHRASE */
.deriv-block {
  background: var(--phrase-bg);
  border-left: 3px solid var(--phrase-border);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 10px;
}
.deriv-label {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--rust);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.deriv-word {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--rust);
}
.deriv-zh {
  font-size: 0.83rem;
  color: var(--muted);
  margin-left: 6px;
}

/* EXAMPLES */
.examples-label {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--sage);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.example {
  background: var(--ex-bg);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 7px;
  font-size: 0.88rem;
  line-height: 1.55;
  border: 1px solid var(--border);
}
.example .en { color: var(--text); font-weight: 600; }
.example .zh { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
.example .en em { color: var(--rust); font-style: normal; font-weight: 800; }

/* PHRASE CARD */
.phrase-word {
  font-family: 'Playfair Display', serif;
  font-size: 1.08rem;
  color: var(--text);
}
.phrase-badge {
  display: inline-block;
  font-size: 0.68rem;
  background: #FFE4CC;
  color: #8B3A0F;
  border-radius: 6px;
  padding: 1px 7px;
  font-weight: 800;
  margin-left: 6px;
  vertical-align: middle;
}

/* UNIT COLOR VARIANTS */
.unit-4 .word-num { background: var(--u4); }
.unit-4 .toggle-icon { color: var(--u4); }
.unit-4 .deriv-label { color: var(--u4); }
.unit-5 .word-num { background: var(--u5); }
.unit-5 .toggle-icon { color: var(--u5); }
.unit-5 .deriv-label { color: var(--u5); }
.unit-6 .word-num { background: var(--u6); }
.unit-6 .toggle-icon { color: var(--u6); }
.unit-6 .deriv-label { color: var(--u6); }

/* STATS BAR */
.stats-bar {
  display: flex; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--cream);
  border-radius: 12px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.stat { font-size: 0.78rem; color: var(--muted); font-weight: 700; }
.stat span { color: var(--amber); }

/* ALL PANEL */
#all .unit-section-title {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  margin: 16px 0 8px;
  color: #fff;
  background: linear-gradient(90deg, var(--amber), var(--gold));
  border-radius: 8px;
  padding: 6px 14px;
  display: inline-block;
}

footer {
  text-align: center;
  padding: 16px;
  color: var(--muted);
  font-size: 0.78rem;
}
</style>
</head>
<body>

<header>
  <h1>📖 Vocabulary Units 4–6</h1>
  <p>衍生詞・慣用語・例句 完整版</p>
</header>

<div class="tabs" id="tabs">
  <button class="tab-btn active" onclick="switchTab('all',this)">全部</button>
  <button class="tab-btn" onclick="switchTab('u4',this)">Unit 4</button>
  <button class="tab-btn" onclick="switchTab('u5',this)">Unit 5</button>
  <button class="tab-btn" onclick="switchTab('u6',this)">Unit 6</button>
</div>

  <input type="text" id="searchBox" placeholder="🔍 搜尋單詞…" oninput="filterCards()">

<main id="mainContent">

  <div class="unit-panel active" id="all"></div>

  <div class="unit-panel" id="u6"></div>
</main>

<footer>Units 4–6 · 共 <span id="totalCount"></span> 個詞條</footer>

let currentTab = 'all';

function buildCards(list, unitClass) {
  return list.map((item, i) => {
    const isPhrase = item.pos === 'phrase';
    const numLabel = String(i + 1).padStart(2, '0');
    const derivLabel = item.deriv.type;
    const posTag = isPhrase ? `<span class="phrase-badge">片語</span>` : `<span class="word-pos">${item.pos}</span>`;

    return `
    <div class="card ${unitClass}" data-word="${item.word.toLowerCase()}">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="word-num">${numLabel}</div>
        <div class="word-main">
          ${isPhrase
            ? `<div class="phrase-word"><em>${item.word}</em>${posTag}</div>`
            : `<div class="word-en">${item.word}${posTag}</div>`}
          <div class="word-zh">${item.zh}</div>
        </div>
        <div class="toggle-icon">▼</div>
      </div>
      <div class="card-body">
        <div class="deriv-block">
          <div class="deriv-label">${derivLabel}</div>
          <span class="deriv-word">${item.deriv.word}</span>
          ${item.deriv.pos ? `<span class="word-pos">${item.deriv.pos}</span>` : ''}
          <span class="deriv-zh">${item.deriv.zh}</span>
        </div>
        <div class="examples-label">例句</div>
        ${item.ex.map(e => `
          <div class="example">
            <div class="en">${e.en}</div>
            <div class="zh">${e.zh}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function init() {
  const u4 = data.filter(d => d.unit === 4);
  const u5 = data.filter(d => d.unit === 5);
  const u6 = data.filter(d => d.unit === 6);

  document.getElementById('totalCount').textContent = data.length;

  const allPanel = document.getElementById('all');
  allPanel.innerHTML = `
    <div class="stats-bar">
      <div class="stat">Unit 4: <span>${u4.length}</span></div>
      <div class="stat">Unit 5: <span>${u5.length}</span></div>
      <div class="stat">Unit 6: <span>${u6.length}</span></div>
      <div class="stat">共: <span>${data.length}</span></div>
    </div>
    <div class="unit-section-title">Unit 4</div>
    ${buildCards(u4, 'unit-4')}
    <div class="unit-section-title">Unit 5</div>
    ${buildCards(u5, 'unit-5')}
    <div class="unit-section-title">Unit 6</div>
    ${buildCards(u6, 'unit-6')}
  `;

  document.getElementById('u4').innerHTML = `<div class="unit-label">Unit 4 — ${u4.length} 個詞條</div>${buildCards(u4, 'unit-4')}`;
  document.getElementById('u5').innerHTML = `<div class="unit-label">Unit 5 — ${u5.length} 個詞條</div>${buildCards(u5, 'unit-5')}`;
  document.getElementById('u6').innerHTML = `<div class="unit-label">Unit 6 — ${u6.length} 個詞條</div>${buildCards(u6, 'unit-6')}`;
}

function toggleCard(header) {
  const card = header.parentElement;
  card.classList.toggle('open');
}

function switchTab(id, btn) {
  currentTab = id;
  document.querySelectorAll('.unit-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  document.getElementById('searchBox').value = '';
  showAllCards();
}

function filterCards() {
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  const panels = q ? ['all', 'u4', 'u5', 'u6'] : [currentTab];

  if (q) {
    document.querySelectorAll('.unit-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('all').classList.add('active');
    currentTab = 'all';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.tab-btn').classList.add('active');
  }

  document.querySelectorAll('.card').forEach(card => {
    const wordEl = card.querySelector('.word-en, .phrase-word');
    const zhEl = card.querySelector('.word-zh');
    const word = card.dataset.word || '';
    const zh = zhEl ? zhEl.textContent.toLowerCase() : '';
    const body = card.querySelector('.card-body') ? card.querySelector('.card-body').textContent.toLowerCase() : '';
    if (!q || word.includes(q) || zh.includes(q) || body.includes(q)) {
      card.style.display = '';
      if (q) card.classList.add('open');
    } else {
      card.style.display = 'none';
      card.classList.remove('open');
    }
  });
}

function showAllCards() {
  document.querySelectorAll('.card').forEach(c => { c.style.display = ''; c.classList.remove('open'); });
}

init();
</script>
