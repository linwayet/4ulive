<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>區塊鏈英文50大術語 · Blockchain English Idioms</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --card: #16213e;
    --card2: #1a2744;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --accent3: #10b981;
    --accent4: #f59e0b;
    --accent5: #ef4444;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --border: rgba(124,58,237,0.3);
    --tag-bg: rgba(124,58,237,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a3e 50%, #0f1a2e 100%);
    border-bottom: 1px solid var(--border);
    padding: 48px 24px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.15) 0%, transparent 70%);
  }
  .hero-badge {
    display: inline-block;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: #a78bfa;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 99px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 12px;
    position: relative;
  }
  .hero h1 span { color: #a78bfa; }
  .hero p {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.7;
    max-width: 560px;
    margin: 0 auto 28px;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    position: relative;
  }
  .stat { text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; color: #a78bfa; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ── SEARCH & FILTER ── */
  .controls {
    max-width: 960px;
    margin: 32px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-muted); }

  .filter-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .filter-btn:hover { border-color: var(--accent); color: #a78bfa; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── CARDS GRID ── */
  .grid {
    max-width: 960px;
    margin: 28px auto 0;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 22px 20px 18px;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    cursor: default;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    border-color: rgba(124,58,237,0.4);
  }
  .card[data-cat="基礎概念"]::before { background: var(--accent); }
  .card[data-cat="密碼學"]::before { background: var(--accent2); }
  .card[data-cat="共識機制"]::before { background: var(--accent3); }
  .card[data-cat="DeFi金融"]::before { background: var(--accent4); }
  .card[data-cat="NFT與資產"]::before { background: var(--accent5); }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .card-num {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .cat-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    letter-spacing: 0.02em;
    flex-shrink: 0;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .card[data-cat="基礎概念"] .cat-tag { background: rgba(124,58,237,0.2); color: #a78bfa; }
  .card[data-cat="密碼學"] .cat-tag { background: rgba(6,182,212,0.2); color: #67e8f9; }
  .card[data-cat="共識機制"] .cat-tag { background: rgba(16,185,129,0.2); color: #6ee7b7; }
  .card[data-cat="DeFi金融"] .cat-tag { background: rgba(245,158,11,0.2); color: #fcd34d; }
  .card[data-cat="NFT與資產"] .cat-tag { background: rgba(239,68,68,0.2); color: #fca5a5; }

  .en-term {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .zh-term {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #a78bfa;
    margin-bottom: 12px;
  }

  .divider { height: 1px; background: rgba(255,255,255,0.06); margin-bottom: 12px; }

  .en-def {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .en-def strong { color: var(--text); }

  .zh-def {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.7;
    background: rgba(255,255,255,0.04);
    border-left: 3px solid rgba(124,58,237,0.5);
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
  }

  .example {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    font-family: 'Inter', sans-serif;
  }
  .example span { color: #7dd3fc; font-style: normal; }

  .speak-btn {
    position: absolute;
    bottom: 14px;
    right: 14px;
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.3);
    color: #a78bfa;
    border-radius: 8px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
  }
  .speak-btn:hover { background: rgba(124,58,237,0.3); transform: scale(1.1); }

  .no-results {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-family: 'Noto Sans TC', sans-serif;
  }
  .no-results .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 40px 20px 20px;
    color: var(--text-muted);
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
  }

  @media (max-width: 600px) {
    .hero { padding: 36px 16px 32px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">⛓️ University English Learning</div>
  <h1>區塊鏈英文 <span>50大慣用語</span></h1>
  <p>專為大學生設計・英文解釋 × 中文對照<br>從零開始掌握 Blockchain 的核心英文詞彙</p>
  <div class="hero-stats">
    <div class="stat"><div class="stat-num">50</div><div class="stat-label">術語 Terms</div></div>
    <div class="stat"><div class="stat-num">5</div><div class="stat-label">分類 Categories</div></div>
    <div class="stat"><div class="stat-num">雙語</div><div class="stat-label">英中對照</div></div>
  </div>
</div>

<div class="controls">
  <input class="search-box" type="text" id="searchInput" placeholder="🔍 搜尋術語 (英文或中文)…" oninput="filterCards()">
  <div class="filter-btns">
    <button class="filter-btn active" onclick="setFilter('全部', this)">全部</button>
    <button class="filter-btn" onclick="setFilter('基礎概念', this)">基礎概念</button>
    <button class="filter-btn" onclick="setFilter('密碼學', this)">密碼學</button>
    <button class="filter-btn" onclick="setFilter('共識機制', this)">共識機制</button>
    <button class="filter-btn" onclick="setFilter('DeFi金融', this)">DeFi金融</button>
    <button class="filter-btn" onclick="setFilter('NFT與資產', this)">NFT與資產</button>
  </div>
</div>

<div class="grid" id="cardGrid"></div>

<footer>
  林威英文教學資源 · 區塊鏈入門英語 · 點擊 🔊 可朗讀英文術語
</footer>

<script>

    zhDef: "加入區塊鏈網路的任何電腦裝置，負責儲存帳本副本並驗證交易，就像整個網路中的一員。",
    ex: "Thousands of <span>nodes</span> store a copy of the Bitcoin blockchain."
  },
  {

  {

    zhDef: "只有受邀成員才能加入的區塊鏈，通常由企業或機構使用，速度較快但較不去中心化。",
    ex: "The bank created a <span>private blockchain</span> for internal records."
  },
  {
    num: 11, cat: "基礎概念",
    en: "Genesis Block",
    zh: "創世區塊",
    enDef: "The <strong>very first block</strong> in a blockchain. Every chain starts here — it has no previous block.",
    zhDef: "區塊鏈的第一個區塊，整條鏈的起點。它沒有「前一個區塊」，是所有後續區塊的祖先。",
    ex: "Satoshi mined the <span>genesis block</span> of Bitcoin in 2009."
  },
  {
    num: 12, cat: "基礎概念",

let currentFilter = '全部';
let currentSearch = '';

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function filterCards() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase();
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cardGrid');
  const filtered = terms.filter(t => {
    const catMatch = currentFilter === '全部' || t.cat === currentFilter;
    const q = currentSearch;
    const searchMatch = !q || t.en.toLowerCase().includes(q) || t.zh.includes(q) || t.zhDef.includes(q);
    return catMatch && searchMatch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results"><span class="emoji">🔍</span>找不到符合的術語，請換個關鍵字試試！</div>';
    return;
  }

  grid.innerHTML = filtered.map(t => `
    <div class="card" data-cat="${t.cat}">
      <div class="card-header">
        <span class="card-num">#${String(t.num).padStart(2,'0')}</span>
        <span class="cat-tag">${t.cat}</span>
      </div>
      <div class="en-term">${t.en}</div>
      <div class="zh-term">${t.zh}</div>
      <div class="divider"></div>
      <div class="en-def">${t.enDef}</div>
      <div class="zh-def">${t.zhDef}</div>
      ${t.ex ? `<div class="example">💡 <span>${t.ex}</span></div>` : ''}
      <button class="speak-btn" onclick="speak('${t.en.replace(/['"]/g, ' ')}', this)" title="朗讀英文術語">🔊</button>
    </div>
  `).join('');
}

function speak(text, btn) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  u.pitch = 1.0;
  btn.textContent = '🔉';
  u.onend = () => btn.textContent = '🔊';
  speechSynthesis.speak(u);
}

renderCards();
</script>
