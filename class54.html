<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林威英文｜七日英文小故事單字課程（小高一 A+ 班）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8F4ED;--ink:#2D2A26;--card:#FFFDF8;--card2:#FBF6EC;
    --line:#E6DCC8;--line2:#D8C9A8;
    --terra:#C0623D;--gold:#C98B2E;--rust:#A0492A;--green:#5F7A4A;--red:#B23A2E;
    --fs:22px;
  }
  *{box-sizing:border-box;}
  html{font-size:var(--fs);}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'BIZ UDPGothic','Nunito',system-ui,-apple-system,sans-serif;
    line-height:1.8;font-size:1rem;-webkit-text-size-adjust:100%;}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px 60px;}

  .nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;
    background:var(--card2);border-bottom:3px solid var(--line2);}
  .nav.bottom{border-bottom:none;border-top:3px solid var(--line2);margin-top:40px;}
  .nav a{flex:1 1 auto;min-width:200px;min-height:64px;display:flex;align-items:center;
    justify-content:center;text-align:center;background:var(--terra);color:#fff;
    text-decoration:none;font-weight:700;border-radius:14px;padding:10px 16px;font-size:1rem;
    box-shadow:0 3px 0 var(--rust);}
  .nav a.b{background:var(--gold);box-shadow:0 3px 0 #9a6a1f;}
  .nav a.c{background:var(--green);box-shadow:0 3px 0 #41562f;}
  .nav a:active{transform:translateY(2px);box-shadow:none;}

  header.hero{text-align:center;padding:34px 12px 10px;}
  header.hero h1{font-size:1.7rem;margin:0 0 8px;color:var(--rust);letter-spacing:.5px;}
  header.hero p{margin:6px auto;max-width:660px;color:#5b524a;font-size:1rem;}
  .badge{display:inline-block;background:var(--terra);color:#fff;font-weight:700;
    padding:6px 18px;border-radius:30px;font-size:.95rem;margin-top:6px;}

  .fontctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px auto;
    background:var(--card);border:2px solid var(--line2);border-radius:16px;padding:12px 16px;max-width:380px;}
  .fontctrl span{font-weight:700;}
  .fontctrl button{min-width:64px;min-height:56px;font-size:1.3rem;font-weight:800;
    background:var(--gold);color:#fff;border:none;border-radius:12px;cursor:pointer;box-shadow:0 3px 0 #9a6a1f;}
  .fontctrl button:active{transform:translateY(2px);box-shadow:none;}

  .tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0;}
  .tab{min-width:96px;min-height:64px;border:none;border-radius:14px;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:1.05rem;color:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:8px;line-height:1.3;background:#b8a98c;box-shadow:0 3px 0 #8d8068;}
  .tab small{font-weight:700;font-size:.7rem;opacity:.9;}
  .tab.active{outline:4px solid var(--ink);transform:translateY(-2px);}
  .tab:active{transform:translateY(2px);box-shadow:none;}

  .day{display:none;animation:fade .25s ease;}
  .day.show{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .day-head{border-radius:18px;padding:20px 22px;color:#fff;margin-bottom:22px;}
  .day-head h2{margin:0 0 4px;font-size:1.4rem;}
  .day-head .zh{font-size:1.05rem;opacity:.95;}

  .section-title{font-size:1.2rem;font-weight:800;margin:30px 0 14px;padding-left:14px;
    border-left:8px solid var(--terra);}

  .story{background:var(--card);border:2px solid var(--line2);border-radius:16px;padding:22px;
    font-size:1.12rem;line-height:2;}
  .story .en{margin:0 0 14px;}
  .story .en b{color:var(--rust);}
  .story .zh{color:#6a5f53;font-size:.98rem;border-top:2px dashed var(--line2);padding-top:14px;}
  .play{min-height:60px;border:none;border-radius:12px;background:var(--green);color:#fff;
    font-weight:800;font-family:inherit;font-size:1rem;padding:8px 22px;cursor:pointer;margin-top:16px;box-shadow:0 3px 0 #41562f;}
  .play:active{transform:translateY(2px);box-shadow:none;}

  .vlist{display:grid;gap:14px;}
  .vcard{background:var(--card);border:2px solid var(--line2);border-radius:16px;padding:16px 18px;}
  .vtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .vnum{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;
    font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1rem;}
  .vword{font-size:1.3rem;font-weight:800;color:var(--rust);}
  .vpos{background:var(--card2);border:2px solid var(--line2);border-radius:8px;padding:2px 10px;
    font-size:.85rem;font-weight:700;color:#7a6a4f;}
  .vphon{color:#8a7d6c;font-size:.95rem;}
  .vsay{margin-left:auto;min-width:58px;min-height:52px;border:none;border-radius:10px;
    background:var(--terra);color:#fff;font-size:1.1rem;cursor:pointer;box-shadow:0 3px 0 var(--rust);}
  .vsay:active{transform:translateY(2px);box-shadow:none;}
  .vmean{font-weight:700;margin:10px 0 6px;font-size:1.05rem;}
  .vex{background:var(--card2);border-radius:10px;padding:10px 14px;margin-top:6px;}
  .vex .e{color:#3a342d;}
  .vex .c{color:#7a6f60;font-size:.95rem;}

  /* color-coded info blocks */
  .cat{border-radius:10px;padding:9px 13px;margin-top:8px;border-left:6px solid;
    font-size:.98rem;line-height:1.7;color:#2D2A26;}
  .cat .lbl{display:inline-block;color:#fff;font-weight:800;font-size:.78rem;
    padding:2px 10px;border-radius:6px;margin-right:8px;white-space:nowrap;}

  .practice{background:var(--card);border:2px solid var(--line2);border-radius:16px;padding:20px;margin-bottom:8px;}
  .bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .bank span{background:var(--card2);border:2px solid var(--line2);border-radius:10px;padding:6px 14px;
    font-weight:700;color:var(--rust);font-size:.98rem;}
  .q{margin:0 0 16px;padding-bottom:16px;border-bottom:1px dashed var(--line2);font-size:1.05rem;}
  .q:last-of-type{border-bottom:none;}
  .q .num{font-weight:800;color:var(--terra);margin-right:6px;}
  .q select,.q input{font-family:inherit;font-size:1rem;font-weight:700;min-height:56px;
    border:2px solid var(--line2);border-radius:10px;padding:4px 10px;margin:0 4px;background:#fff;color:var(--ink);max-width:100%;}
  .q input{width:180px;max-width:62%;}
  .q .hint{color:#8a7d6c;font-size:.9rem;}
  .q.right select,.q.right input{border-color:var(--green);background:#eef3e6;color:var(--green);}
  .q.wrong select,.q.wrong input{border-color:var(--red);background:#f7e9e7;color:var(--red);}
  .q .sol{display:none;margin-top:8px;color:var(--green);font-weight:700;font-size:.98rem;}
  .q.wrong .sol{display:block;}
  .check{min-height:64px;border:none;border-radius:14px;background:var(--gold);color:#fff;
    font-family:inherit;font-weight:800;font-size:1.1rem;padding:10px 30px;cursor:pointer;box-shadow:0 3px 0 #9a6a1f;margin-top:6px;}
  .check:active{transform:translateY(2px);box-shadow:none;}
  .score{margin-top:16px;font-weight:800;font-size:1.15rem;text-align:center;min-height:30px;}

  footer.tip{text-align:center;color:#8a7d6c;font-size:.9rem;margin-top:30px;}
</style>
</head>

<div class="wrap">
  <header class="hero">
    <h1>七日英文小故事單字課程</h1>
    <p>專為「會考剛結束、英文 A+」的準高一生設計。每天一篇 50 字小故事、10 個進階單字（KK 音標＋詞性＋例句＋衍生詞／字根／片語／慣用語／易混淆／重點），再加上「選擇填充」與「衍生字填空」兩種練習，銜接高中 7000 單字。</p>
    <span class="badge">小高一 A+ 銜接班</span>
  </header>

  <div class="fontctrl">
    <span>字級</span>
    <button id="fminus" aria-label="縮小字體">A－</button>
    <span id="fsval">22</span>
    <button id="fplus" aria-label="放大字體">A＋</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="days"></div>

  <footer class="tip">練習作答後按「批改」即可看分數與解答<br>林威英文 · 34 年教學經驗</footer>
</div>

</nav>

<script>

const CATS=[
 ["dv","衍生詞","#FDEDEC","#C0392B"],
 ["rt","字根","#EBF5FB","#1565C0"],
 ["ph","片語","#EAFAF1","#2E7D32"],
 ["id","慣用語","#FEF9E7","#D68910"],
 ["cf","容易混淆","#F5EEF8","#6A1B9A"],
 ["ky","強調 / 重點","#FEF0E7","#E65100"]
];

/* ===================== COURSE DATA ===================== */
const COURSE=[
 {
  day:1,color:"#C0623D",title:"A Brand New Start",zh:"嶄新的開始",
  story:[{t:"On my first day of high school, I felt "},{w:"nervous"},{t:" walking onto the "},{w:"unfamiliar"},{t:" "},{w:"campus"},{t:". A friendly "},{w:"classmate"},{t:" helped me find my "},{w:"locker"},{t:" and read my "},{w:"schedule"},{t:". She "},{w:"introduced"},{t:" me to others. Soon I felt more "},{w:"confident"},{t:". This new "},{w:"opportunity"},{t:" made me believe I truly "},{w:"belong"},{t:" here."}],
  storyZh:"高中第一天，我緊張地走進陌生的校園。一位友善的同學幫我找到置物櫃、看懂課表，還把我介紹給其他人。漸漸地我變得更有自信。這個全新的機會讓我相信，我真正屬於這裡。",
  vocab:[
   {w:"nervous",p:"/ˈnɝvəs/",pos:"adj.",m:"緊張的、焦慮的",e:"She felt nervous before the interview.",ec:"她面試前感到很緊張。",
    dv:"nervous (adj.) → nervously (adv.) 緊張地 → nervousness (n.) 緊張",ph:"be nervous about + N 對⋯感到緊張",cf:"nervous（緊張）≠ annoyed（惱怒）；前者擔心，後者生氣"},
   {w:"unfamiliar",p:"/ˌʌnfəˈmɪljɚ/",pos:"adj.",m:"不熟悉的、陌生的",e:"The streets here are unfamiliar to me.",ec:"這裡的街道對我很陌生。",
    rt:"un-（否定）＋ familiar（熟悉的）＝ 不熟悉的",dv:"familiar (adj.) 熟悉的 → familiarity (n.) 熟悉",ph:"be unfamiliar with + N 對⋯不熟"},
   {w:"campus",p:"/ˈkæmpəs/",pos:"n.",m:"校園",e:"Our campus has a big sports field.",ec:"我們校園有一個大運動場。",
    ph:"on campus 在校園內／off campus 在校外",ky:"複數為 campuses；指「整片校地」"},
   {w:"classmate",p:"/ˈklæsˌmet/",pos:"n.",m:"同班同學",e:"My classmate lent me her notes.",ec:"我同學把筆記借我。",
    rt:"class（班級）＋ mate（夥伴）",cf:"classmate 同班／schoolmate 同校／roommate 室友"},
   {w:"locker",p:"/ˈlɑkɚ/",pos:"n.",m:"置物櫃",e:"I keep my books in my locker.",ec:"我把書放在置物櫃裡。",
    rt:"lock（鎖）＋ -er（物品）＝ 可上鎖的櫃子",dv:"lock (v.) 鎖上 → lock (n.) 鎖頭"},
   {w:"schedule",p:"/ˈskɛdʒul/",pos:"n.",m:"時間表、課表",e:"Check the schedule for tomorrow.",ec:"查一下明天的時間表。",
    ph:"on schedule 準時／ahead of schedule 提前／behind schedule 落後",ky:"美音 /ˈskɛdʒul/、英音 /ˈʃɛdjul/；也可當動詞「安排」"},
   {w:"introduce",p:"/ˌɪntrəˈdjus/",pos:"v.",m:"介紹",e:"Let me introduce you to my family.",ec:"讓我把你介紹給家人。",
    rt:"intro-（向內）＋ -duce（引導，duct = lead）＝ 引進、介紹",dv:"introduce (v.) → introduction (n.) 介紹／引言 → introductory (adj.) 入門的",ph:"introduce A to B 把 A 介紹給 B"},
   {w:"confident",p:"/ˈkɑnfədənt/",pos:"adj.",m:"有自信的",e:"He is confident about passing the exam.",ec:"他對通過考試很有信心。",
    dv:"confident (adj.) → confidence (n.) 自信 → confidently (adv.) 自信地",cf:"confident（有自信）≠ confidential（機密的）拼字相近易錯！",ph:"be confident about / of + N"},
   {w:"opportunity",p:"/ˌɑpɚˈtjunətɪ/",pos:"n.",m:"機會",e:"This is a great opportunity to learn.",ec:"這是很好的學習機會。",
    cf:"opportunity（機會，較正式）≈ chance（機會，較口語）",ph:"take the opportunity to + V 把握機會做⋯"},
   {w:"belong",p:"/bəˈlɔŋ/",pos:"v.",m:"屬於",e:"This book belongs to the library.",ec:"這本書屬於圖書館。",
    dv:"belong (v.) → belongings (n. pl.) 個人物品、隨身財物",ph:"belong to + 人／地方 屬於⋯"}
  ],
  prac:[
   ["I was so ___ before my first speech.","nervous"],
   ["Our school ___ has a big new library.","campus"],
   ["Please put your books in your ___.","locker"],
   ["Let me ___ you to my best friend.","introduce"],
   ["The contest gave me a great ___ to study abroad.","opportunity"],
   ["After lots of practice, she felt ___ about the test.","confident"],
   ["A kind ___ lent me a pencil when I forgot mine.","classmate"],
   ["This club is where I feel I truly ___.","belong"]
  ],
  deriv:[
   ["He waited ___ for his exam result.","nervous","nervously"],
   ["She answered every question with ___.","confident","confidence"],
   ["The teacher gave a short ___ before the lesson.","introduce","introduction"],
   ["Don't forget to take your ___ when you leave.","belong","belongings"]
  ]
 },
 {
  day:2,color:"#C98B2E",title:"Making New Friends",zh:"結交新朋友",
  story:[{t:"At lunch, I was too "},{w:"shy"},{t:" to start a "},{w:"conversation"},{t:". Then a boy "},{w:"shared"},{t:" his lunch with me. We found "},{w:"common"},{t:" "},{w:"interests"},{t:" in music. He had a great sense of "},{w:"humor"},{t:" and "},{w:"encouraged"},{t:" me to join the club. A true friend is "},{w:"loyal"},{t:" and offers "},{w:"support"},{t:" and "},{w:"trust"},{t:"."}],
  storyZh:"午餐時，我太害羞而不敢開口聊天。後來一個男生跟我分享午餐。我們發現對音樂有共同的興趣。他很有幽默感，還鼓勵我加入社團。真正的朋友是忠誠的，會給予支持與信任。",
  vocab:[
   {w:"shy",p:"/ʃaɪ/",pos:"adj.",m:"害羞的",e:"The shy girl rarely speaks in class.",ec:"那害羞的女孩很少發言。",
    dv:"shy (adj.) → shyly (adv.) 害羞地 → shyness (n.) 害羞",cf:"shy（怕生、害羞）≠ quiet（安靜，不一定怕生）"},
   {w:"conversation",p:"/ˌkɑnvɚˈseʃən/",pos:"n.",m:"對話、交談",e:"We had a nice conversation about books.",ec:"我們愉快地聊書。",
    rt:"con-（一起）＋ verse（轉、談）＝ 交談",dv:"converse (v.) 交談 → conversational (adj.) 口語的",ph:"have a conversation with sb"},
   {w:"share",p:"/ʃɛr/",pos:"v.",m:"分享",e:"Children should learn to share toys.",ec:"孩子該學會分享玩具。",
    ph:"share A with B 與 B 分享 A",id:"share and share alike 有福同享、平均分攤"},
   {w:"common",p:"/ˈkɑmən/",pos:"adj.",m:"共同的、常見的",e:"We have a lot in common.",ec:"我們有很多共通點。",
    dv:"common (adj.) → commonly (adv.) 普遍地",ph:"have sth in common 有共同點",cf:"common（常見的）≠ ordinary（普通、無特色的）"},
   {w:"interest",p:"/ˈɪntrɪst/",pos:"n.",m:"興趣",e:"Reading is one of her main interests.",ec:"閱讀是她主要興趣之一。",
    dv:"interest (n.) → interested (adj.) 感興趣的 → interesting (adj.) 有趣的",cf:"interested（人感到興趣）≠ interesting（事物有趣）",ph:"be interested in + N/V-ing"},
   {w:"humor",p:"/ˈhjumɚ/",pos:"n.",m:"幽默",e:"His sense of humor makes everyone laugh.",ec:"他的幽默感讓大家發笑。",

   {w:"encourage",p:"/ɪnˈkɝɪdʒ/",pos:"v.",m:"鼓勵",e:"My teacher encouraged me to try again.",ec:"老師鼓勵我再試一次。",

   {w:"loyal",p:"/ˈlɔɪəl/",pos:"adj.",m:"忠誠的",e:"A dog is a loyal animal.",ec:"狗是忠誠的動物。",

  prac:[

   ["We had a long ___ about our favorite movies.","conversation"],

   ["My main ___ is collecting old coins.","interest"],
   ["A ___ dog always stays by its owner's side.","loyal"],
   ["My parents always ___ me to follow my dreams.","encourage"],

   ["Thank you for your warm ___ and kind words.","encourage","encouragement"],
   ["A good friend shows great ___ to you.","loyal","loyalty"]
  ]
 },
 {
  day:3,color:"#7A8B4F",title:"A Summer Adventure",zh:"暑假大冒險",
  story:[{t:"Last summer, we began a "},{w:"journey"},{t:" to "},{w:"explore"},{t:" a tall mountain. The view at the top was "},{w:"breathtaking"},{t:". Though we felt "},{w:"exhausted"},{t:", our "},{w:"courage"},{t:" helped us "},{w:"achieve"},{t:" our goal. Watching the "},{w:"sunrise"},{t:" was a "},{w:"memorable"},{t:" moment. I felt "},{w:"grateful"},{t:" for this "},{w:"adventure"},{t:"."}],
  storyZh:"去年夏天，我們展開一段旅程去探索一座高山。山頂的景色令人嘆為觀止。雖然筋疲力盡，但勇氣讓我們達成目標。看著日出是難忘的時刻。我很感激這場冒險。",

   ["With age and experience comes ___.","wise","wisdom"],
   ["Regular exercise can ___ your muscles.","strength","strengthen"]
  ]
 }
];

/* ===================== RENDER ===================== */
const tabsEl=document.getElementById('tabs');
const daysEl=document.getElementById('days');
const weekZh=["一","二","三","四","五","六","日"];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

COURSE.forEach((d,i)=>{
  const tab=document.createElement('button');
  tab.className='tab'+(i===0?' active':'');
  tab.style.background=d.color;
  tab.innerHTML=`Day ${d.day}<small>第${weekZh[i]}天</small>`;
  tab.onclick=()=>switchDay(i);
  tabsEl.appendChild(tab);

  const panel=document.createElement('div');
  panel.className='day'+(i===0?' show':'');

  let storyHtml='';
  d.story.forEach(s=>{ if(s.w!==undefined&&s.w!=='') storyHtml+=`<b>${s.w}</b>`; if(s.t) storyHtml+=s.t; });
  const plainStory=d.story.map(s=>(s.w?s.w:'')+(s.t||'')).join('');

  // vocab cards
  let vocabHtml='';
  d.vocab.forEach((v,n)=>{
    let cats='';
    CATS.forEach(([key,label,bg,acc])=>{
      if(v[key]){
        cats+=`<div class="cat" style="background:${bg};border-left-color:${acc}">
          <span class="lbl" style="background:${acc}">${label}</span>${esc(v[key])}</div>`;
      }
    });
    vocabHtml+=`<div class="vcard">
      <div class="vtop">
        <div class="vnum">${n+1}</div>
        <div class="vword">${v.w}</div>
        <div class="vpos">${v.pos}</div>
        <div class="vphon">${v.p}</div>
      </div>
      <div class="vmean">${v.m}</div>
      <div class="vex"><div class="e">${v.e}</div><div class="c">${v.ec}</div></div>
      ${cats}
    </div>`;
  });

  const bank=d.vocab.map(v=>`<span>${v.w}</span>`).join('');
  const opts=d.vocab.map(v=>v.w);

  // cloze practice (select)
  let pracHtml='';
  d.prac.forEach((q,n)=>{
    const parts=q[0].split('___');
    let sel=`<select data-ans="${q[1]}"><option value="">— 請選擇 —</option>`;
    [...opts].sort(()=>Math.random()-0.5).forEach(o=>{sel+=`<option value="${o}">${o}</option>`;});
    sel+=`</select>`;
    pracHtml+=`<div class="q"><span class="num">${n+1}.</span>${parts[0]}${sel}${parts[1]||''}
      <div class="sol">✔ 正解：<b>${q[1]}</b></div></div>`;
  });

  // derivative practice (typed)
  let derivHtml='';
  d.deriv.forEach((q,n)=>{
    const parts=q[0].split('___');
    derivHtml+=`<div class="q"><span class="num">${n+1}.</span>${parts[0]}
      <input type="text" data-ans="${q[2]}" autocomplete="off" autocapitalize="off" spellcheck="false">${parts[1]||''}
      <span class="hint">（提示：${q[1]}）</span>
      <div class="sol">✔ 正解：<b>${q[2]}</b></div></div>`;
  });

  panel.innerHTML=`
    <div class="day-head" style="background:${d.color}">
      <h2>Day ${d.day} · ${d.title}</h2><div class="zh">${d.zh}</div>
    </div>

    <div class="section-title">📖 50 字小故事</div>
    <div class="story">
      <p class="en">${storyHtml}</p>
      <p class="zh">${d.storyZh}</p>
    </div>

    <div class="section-title">📚 10 個核心單字</div>
    <div class="vlist">${vocabHtml}</div>

    <div class="section-title">✏️ 練習一：選擇填充</div>
    <div class="practice">
      <div class="bank">${bank}</div>
      ${pracHtml}
      <button class="check" onclick="checkCloze(this)">批改 ✔</button>
      <div class="score"></div>
    </div>

    <div class="section-title">🧩 練習二：衍生字填空</div>
    <div class="practice">
      <div class="bank"><span style="background:#FDEDEC;border-color:#C0392B;color:#C0392B">依提示字變化出正確詞性，填入空格</span></div>
      ${derivHtml}
      <button class="check" onclick="checkDeriv(this)">批改 ✔</button>
      <div class="score"></div>
    </div>
  `;
  daysEl.appendChild(panel);
});

function switchDay(i){
  document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===i));
  document.querySelectorAll('.day').forEach((p,k)=>p.classList.toggle('show',k===i));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---- check: cloze ---- */
function checkCloze(btn){
  const box=btn.closest('.practice');
  const qs=box.querySelectorAll('.q');
  let correct=0;
  qs.forEach(q=>{
    const sel=q.querySelector('select');
    q.classList.remove('right','wrong');
    if(sel.value.toLowerCase()===sel.dataset.ans.toLowerCase()){q.classList.add('right');correct++;}
    else q.classList.add('wrong');
  });
  showScore(box,correct,qs.length);
}

/* ---- check: derivative ---- */
function checkDeriv(btn){
  const box=btn.closest('.practice');
  const qs=box.querySelectorAll('.q');
  let correct=0;
  qs.forEach(q=>{
    const inp=q.querySelector('input');
    q.classList.remove('right','wrong');
    const val=(inp.value||'').trim().toLowerCase();
    if(val===inp.dataset.ans.toLowerCase()){q.classList.add('right');correct++;}
    else q.classList.add('wrong');
  });
  showScore(box,correct,qs.length);
}

function showScore(box,correct,total){
  const el=box.querySelector('.score');
  let msg=`得分：${correct} / ${total}`;
  if(correct===total){msg+=' 🎉 全對！太棒了！';party();}
  else if(correct>=total*0.6) msg+=' 👍 不錯，再加油！';
  else msg+=' 💪 多複習單字，你做得到！';
  el.textContent=msg;
  el.style.color=correct===total?'#5F7A4A':'#A0492A';
}

/* ---- mini confetti ---- */
function party(){
  const colors=['#C0623D','#C98B2E','#7A8B4F','#A0492A','#5F7A4A'];
  for(let i=0;i<30;i++){
    const c=document.createElement('div');
    c.style.cssText=`position:fixed;width:10px;height:10px;border-radius:2px;left:${Math.random()*100}vw;top:-20px;z-index:9999;pointer-events:none;background:${colors[i%colors.length]};opacity:.9;`;
    document.body.appendChild(c);
    const dur=1200+Math.random()*1200;
    c.animate([{transform:'translateY(0) rotate(0)'},{transform:`translateY(100vh) rotate(${720*Math.random()}deg)`}],{duration:dur,easing:'ease-in'});
    setTimeout(()=>c.remove(),dur);
  }
}

/* ---- font size ---- */
let fs=22;
const fsval=document.getElementById('fsval');
document.getElementById('fplus').onclick=()=>{if(fs<32){fs+=2;applyFs();}};
document.getElementById('fminus').onclick=()=>{if(fs>18){fs-=2;applyFs();}};
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'px');fsval.textContent=fs;}
</script>
