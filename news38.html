<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中英文單字本 Unit 7–12</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Noto+Serif+TC:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --sand: #F5EDD8;
  --cream: #FBF6EC;
  --parchment: #EFE4C6;
  --amber: #C8821A;
  --amber-soft: #E8A83A;
  --rust: #B84020;
  --rust-soft: #D4623A;
  --clay: #A05030;
  --sienna: #8B4513;
  --olive: #6B7A2A;
  --olive-soft: #8E9E3A;
  --forest: #2D5A27;
  --gold: #C49A20;
  --warm-brown: #5C3A1E;
  --mid-brown: #7A5030;
  --light-brown: #A07040;
  --border-warm: #D8C4A0;
  --shadow-warm: rgba(120, 70, 20, 0.12);

  --u7: #C8821A;
  --u8: #B84020;
  --u9: #6B7A2A;
  --u10: #8B4513;
  --u11: #A05030;
  --u12: #2D5A27;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Source Serif 4', 'Noto Serif TC', Georgia, serif;
  background: var(--sand);
  color: var(--warm-brown);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 8%, rgba(200,130,26,0.10) 0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 88% 92%, rgba(184,64,32,0.07) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C8821A' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

/* ── HEADER ── */
.site-header {
  background: linear-gradient(160deg, #4A2008 0%, #8B3A10 25%, #C8621A 55%, #D4961E 80%, #C4A030 100%);
  padding: 48px 24px 36px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 30px rgba(80,30,0,0.35);
}
.site-header::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    -55deg, transparent, transparent 30px,
    rgba(255,255,255,0.025) 30px, rgba(255,255,255,0.025) 60px
  );
}
.site-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, transparent, rgba(255,220,100,0.6), transparent);
}
.header-inner { position: relative; z-index: 1; }
.header-eyebrow {
  font-family: 'Noto Serif TC', serif;
  font-size: 0.78rem;
  letter-spacing: 0.2em;
  color: rgba(255,220,150,0.8);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.header-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.8rem, 5vw, 3.2rem);
  font-weight: 700;
  color: #FFF8E8;
  text-shadow: 2px 4px 12px rgba(0,0,0,0.35);
  line-height: 1.15;
  margin-bottom: 10px;
}
.header-title em {
  font-style: italic;
  color: #FFD97A;
}
.header-sub {
  font-family: 'Noto Serif TC', serif;
  font-size: 0.92rem;
  color: rgba(255,230,170,0.85);
  margin-top: 8px;
}
.header-pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}
.header-pill {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,220,130,0.3);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 0.78rem;
  color: rgba(255,230,180,0.9);
  font-family: 'Noto Serif TC', serif;
  backdrop-filter: blur(4px);
}

/* ── CONTROLS ── */
.controls-bar {
  background: var(--cream);
  border-bottom: 2px solid var(--border-warm);
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 3px 16px var(--shadow-warm);
}
.controls-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.search-wrap {
  flex: 1;
  min-width: 180px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  border: 2px solid var(--border-warm);
  border-radius: 25px;
  background: white;
  font-family: 'Source Serif 4', serif;
  font-size: 0.93rem;
  color: var(--warm-brown);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap input:focus {
  border-color: var(--amber);
  box-shadow: 0 0 0 3px rgba(200,130,26,0.12);
}
.search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--light-brown);
  font-size: 0.95rem;
  pointer-events: none;
}
.unit-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.utab {
  padding: 6px 14px;
  border-radius: 18px;
  border: 2px solid var(--border-warm);
  background: white;
  font-family: 'Noto Serif TC', serif;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--mid-brown);
  white-space: nowrap;
}
.utab:hover { border-color: var(--amber); color: var(--amber); }
.utab.active { color: white; border-color: transparent; }
.utab[data-unit="all"].active  { background: var(--warm-brown); }
.utab[data-unit="7"].active   { background: var(--u7); }
.utab[data-unit="8"].active   { background: var(--u8); }
.utab[data-unit="9"].active   { background: var(--u9); }
.utab[data-unit="10"].active  { background: var(--u10); }
.utab[data-unit="11"].active  { background: var(--u11); }
.utab[data-unit="12"].active  { background: var(--u12); }

/* ── MAIN ── */
.main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}
.stats-row {
  font-family: 'Noto Serif TC', serif;
  font-size: 0.82rem;
  color: var(--light-brown);
  margin-bottom: 20px;
  text-align: right;
}
.stats-row strong { color: var(--amber); }

/* ── UNIT SECTIONS ── */
.unit-section { margin-bottom: 48px; }
.unit-heading {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 22px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border-warm);
}
.unit-badge {
  flex-shrink: 0;
  width: 52px; height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: white;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}
.unit-title-text {}
.unit-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 600;
  opacity: 0.7;
  margin-bottom: 2px;
}
.unit-topic {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--warm-brown);
}
.unit-count-tag {
  margin-left: auto;
  font-family: 'Noto Serif TC', serif;
  font-size: 0.78rem;
  color: var(--light-brown);
  background: var(--parchment);
  border: 1px solid var(--border-warm);
  border-radius: 12px;
  padding: 3px 12px;
}

/* ── GRID ── */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 18px;
}

/* ── CARD ── */
.vocab-card {
  background: var(--cream);
  border: 1.5px solid var(--border-warm);
  border-radius: 14px;
  padding: 18px 18px 16px;
  box-shadow: 0 2px 10px var(--shadow-warm);
  transition: transform 0.22s ease, box-shadow 0.22s ease;
  position: relative;
  overflow: hidden;
}
.vocab-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 14px 14px 0 0;
}
.vocab-card[data-unit="7"]::before  { background: linear-gradient(90deg, var(--u7), var(--amber-soft)); }
.vocab-card[data-unit="8"]::before  { background: linear-gradient(90deg, var(--u8), var(--rust-soft)); }
.vocab-card[data-unit="9"]::before  { background: linear-gradient(90deg, var(--u9), var(--olive-soft)); }
.vocab-card[data-unit="10"]::before { background: linear-gradient(90deg, var(--u10), var(--clay)); }
.vocab-card[data-unit="11"]::before { background: linear-gradient(90deg, var(--u11), var(--clay)); }
.vocab-card[data-unit="12"]::before { background: linear-gradient(90deg, var(--u12), var(--forest)); }
.vocab-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 28px rgba(100,50,10,0.18);
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.word-block {}
.word-en {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.55rem;
  font-weight: 700;
  line-height: 1.15;
  color: var(--warm-brown);
}
.word-zh {
  font-family: 'Noto Serif TC', serif;
  font-size: 0.85rem;
  color: var(--mid-brown);
  margin-top: 3px;
}
.pos-tag {
  flex-shrink: 0;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 20px;
  color: white;
  margin-top: 4px;
}
.vocab-card[data-unit="7"]  .pos-tag { background: var(--u7); }
.vocab-card[data-unit="8"]  .pos-tag { background: var(--u8); }
.vocab-card[data-unit="9"]  .pos-tag { background: var(--u9); }
.vocab-card[data-unit="10"] .pos-tag { background: var(--u10); }
.vocab-card[data-unit="11"] .pos-tag { background: var(--u11); }
.vocab-card[data-unit="12"] .pos-tag { background: var(--u12); }

/* DERIVATION */
.deriv-box {
  background: var(--parchment);
  border: 1px solid var(--border-warm);
  border-radius: 9px;
  padding: 8px 12px;
  margin-bottom: 12px;
}
.deriv-label {
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--olive);
  margin-bottom: 6px;
}
.deriv-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: white;
  border: 1px solid #E0CBA0;
  border-radius: 16px;
  padding: 2px 9px;
  font-size: 0.77rem;
}
.chip-pos {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--olive-soft);
}
.chip-word {
  font-style: italic;
  font-weight: 600;
  color: var(--sienna);
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.9rem;
}
.chip-zh {
  color: var(--mid-brown);
  font-family: 'Noto Serif TC', serif;
  font-size: 0.72rem;
}

/* EXAMPLES */
.ex-label {
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--rust);
  margin-bottom: 7px;
}
.ex-item {
  border-left: 3px solid;
  border-radius: 0 7px 7px 0;
  padding: 7px 10px;
  margin-bottom: 7px;
  background: rgba(255,255,255,0.55);
}
.ex-item:last-child { margin-bottom: 0; }
.vocab-card[data-unit="7"]  .ex-item { border-color: var(--u7); }
.vocab-card[data-unit="8"]  .ex-item { border-color: var(--u8); }
.vocab-card[data-unit="9"]  .ex-item { border-color: var(--u9); }
.vocab-card[data-unit="10"] .ex-item { border-color: var(--u10); }
.vocab-card[data-unit="11"] .ex-item { border-color: var(--u11); }
.vocab-card[data-unit="12"] .ex-item { border-color: var(--u12); }
.ex-en {
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--warm-brown);
  margin-bottom: 3px;
}
.ex-en em { font-style: italic; font-weight: 700; color: var(--rust); }
.ex-zh {
  font-size: 0.8rem;
  line-height: 1.5;
  color: var(--mid-brown);
  font-family: 'Noto Serif TC', serif;
}

/* HIDDEN / NO RESULTS */
.vocab-card.hidden { display: none; }
.no-results {
  text-align: center;
  padding: 60px;
  color: var(--light-brown);
  font-size: 1rem;
  font-family: 'Noto Serif TC', serif;
  display: none;
}
.no-results.show { display: block; }
.unit-section.hidden { display: none; }

footer {
  text-align: center;
  padding: 20px;
  font-family: 'Noto Serif TC', serif;
  font-size: 0.78rem;
  color: var(--light-brown);
  border-top: 1px solid var(--border-warm);
  margin-top: 20px;
}

@media (max-width: 640px) {
  .vocab-grid { grid-template-columns: 1fr; }
  .controls-inner { flex-direction: column; }
  .unit-tabs { width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-eyebrow">高中英文單字本</div>
    <h1 class="header-title">Unit 7 – 12<br><em>Vocabulary Cards</em></h1>
    <p class="header-sub">含衍生詞・慣用語・雙語例句</p>
    <div class="header-pills">
      <span class="header-pill">Unit 7 Cologne</span>
      <span class="header-pill">Unit 8 Olympics</span>
      <span class="header-pill">Unit 9 Water</span>
      <span class="header-pill">Unit 10 Navigation</span>
      <span class="header-pill">Unit 11 Memory</span>
      <span class="header-pill">Unit 12 Food Waste</span>
    </div>
  </div>
</header>

<nav class="controls-bar">
  <div class="controls-inner">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜尋英文單字或中文意思..." oninput="applyFilters()">
    </div>
    <div class="unit-tabs">
      <button class="utab active" data-unit="all" onclick="setUnit('all',this)">全部</button>
      <button class="utab" data-unit="7"  onclick="setUnit('7',this)">Unit 7</button>
      <button class="utab" data-unit="8"  onclick="setUnit('8',this)">Unit 8</button>
      <button class="utab" data-unit="9"  onclick="setUnit('9',this)">Unit 9</button>
      <button class="utab" data-unit="10" onclick="setUnit('10',this)">Unit 10</button>
      <button class="utab" data-unit="11" onclick="setUnit('11',this)">Unit 11</button>
      <button class="utab" data-unit="12" onclick="setUnit('12',this)">Unit 12</button>
    </div>
  </div>
</nav>

<main class="main" id="mainContent">
  <div class="stats-row">顯示 <strong id="visibleCount">0</strong> 個單字</div>
  <div id="noResults" class="no-results">😕 找不到符合的單字</div>
</main>

<footer>高中英文 Unit 7–12 互動單字卡 ｜ 衍生詞・雙語例句</footer>

<script>
const UNITS = {
  7:  { topic:"Cologne: A Cultural Capital",  color:"#C8821A" },

  9:  { topic:"The Benefits of Conserving Water", color:"#6B7A2A" },
  10: { topic:"Stellar Navigating Skills",    color:"#8B4513" },
  11: { topic:"Tips for Remembering What You've Learned", color:"#A05030" },
  12: { topic:"The War against Food Waste",   color:"#2D5A27" },
};

const VOCAB = [
  // ── UNIT 7 ──
  {u:7,w:"majesty",pos:"n.",zh:"雄偉；威嚴；陛下",

      {en:"She follows strict dietary <em>guidelines</em> recommended by her doctor.",zh:"她遵循醫生推薦的嚴格飲食準則。"}]},
  {u:12,w:"leftovers",pos:"n.",zh:"剩菜；剩餘物（複數）",
   d:[{p:"adj.",w:"leftover",z:"剩餘的；留下的"},{p:"phrase",w:"use up leftovers",z:"用完剩菜"}],
   e:[{en:"She made a delicious soup from last night's <em>leftovers</em>.",zh:"她用昨晚的剩菜做了一道美味的湯。"},
      {en:"Always store <em>leftovers</em> in airtight containers.",zh:"剩菜請務必存放在密封容器中。"}]},
  {u:12,w:"doggy bag",pos:"phrase/n.",zh:"打包帶走的餐盒；外帶剩菜的袋子",
   d:[{p:"phrase",w:"ask for a doggy bag",z:"要求打包"},{p:"phrase",w:"take home in a doggy bag",z:"打包帶回家"}],
   e:[{en:"She asked the waiter for a <em>doggy bag</em> to take home the rest of her meal.",zh:"她請服務生幫她打包帶走剩餘的食物。"},
      {en:"Asking for a <em>doggy bag</em> at restaurants helps reduce food waste.",zh:"在餐廳要求打包有助於減少食物浪費。"}]},
  {u:12,w:"gobble",pos:"v.",zh:"狼吞虎嚥；急切地消費；咕嚕叫",
   d:[{p:"phrase",w:"gobble up",z:"狼吞虎嚥；迅速吞噬"},{p:"phrase",w:"gobble down",z:"急忙吃下"}],
   e:[{en:"The children <em>gobbled</em> up all the pizza in minutes.",zh:"孩子們幾分鐘內就狼吞虎嚥地吃完了所有披薩。"},
      {en:"Don't <em>gobble</em> your food—eat slowly and enjoy each bite.",zh:"不要狼吞虎嚥——慢慢吃，享受每一口。"}]},
];

let currentUnit = 'all';

function buildPage() {
  const main = document.getElementById('mainContent');
  [7,8,9,10,11,12].forEach(u => {
    const words = VOCAB.filter(v => v.u === u);
    const sec = document.createElement('div');
    sec.className = 'unit-section';
    sec.dataset.unit = u;

    const col = UNITS[u].color;
    sec.innerHTML = `
      <div class="unit-heading">
        <div class="unit-badge" style="background:${col}">${u}</div>
        <div class="unit-title-text">
          <div class="unit-num" style="color:${col}">Unit ${u}</div>
          <div class="unit-topic">${UNITS[u].topic}</div>
        </div>
        <span class="unit-count-tag">${words.length} 個單字</span>
      </div>
      <div class="vocab-grid" id="grid-${u}"></div>
    `;
    main.appendChild(sec);

    const grid = sec.querySelector('.vocab-grid');
    words.forEach(v => {
      const card = document.createElement('div');
      card.className = 'vocab-card';
      card.dataset.unit = u;
      card.dataset.word = v.w.toLowerCase();
      card.dataset.zh = v.zh;

      const chips = v.d.map(d =>
        `<span class="chip"><span class="chip-pos">${d.p}</span><span class="chip-word">${d.w}</span><span class="chip-zh">${d.z}</span></span>`
      ).join('');

      const exs = v.e.map(e =>
        `<div class="ex-item"><div class="ex-en">${e.en}</div><div class="ex-zh">${e.zh}</div></div>`
      ).join('');

      card.innerHTML = `
        <div class="card-top">
          <div class="word-block">
            <div class="word-en">${v.w}</div>
            <div class="word-zh">${v.zh}</div>
          </div>
          <span class="pos-tag">${v.pos}</span>
        </div>
        <div class="deriv-box">
          <div class="deriv-label">衍生詞 / 片語</div>
          <div class="deriv-chips">${chips}</div>
        </div>
        <div class="ex-section">
          <div class="ex-label">例句</div>
          ${exs}
        </div>
      `;
      grid.appendChild(card);
    });
  });
  updateCount();
}

function setUnit(u, btn) {
  currentUnit = u;
  document.querySelectorAll('.utab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const cards = document.querySelectorAll('.vocab-card');
  let vis = 0;
  cards.forEach(c => {
    const uMatch = currentUnit === 'all' || c.dataset.unit === currentUnit;
    const qMatch = !q || c.dataset.word.includes(q) || c.dataset.zh.includes(q);
    const show = uMatch && qMatch;
    c.classList.toggle('hidden', !show);
    if (show) vis++;
  });

  document.querySelectorAll('.unit-section').forEach(s => {
    const unitMatch = currentUnit === 'all' || s.dataset.unit === currentUnit;
    s.classList.toggle('hidden', !unitMatch);
  });

  document.getElementById('visibleCount').textContent = vis;
  document.getElementById('noResults').classList.toggle('show', vis === 0 && q !== '');
}

function updateCount() {
  document.getElementById('visibleCount').textContent = VOCAB.length;
}

buildPage();
</script>
</body>
</html>
