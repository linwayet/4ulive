<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中壢高中單字本 Unit 6-2 ～ 7-3</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Serif+TC:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #FDF6EC;
  --warm-bg: #FAF0DC;
  --card-bg: #FFFBF4;
  --amber: #D4821A;
  --amber-light: #F0A830;
  --amber-dark: #A0620F;
  --rust: #C1440E;
  --rust-light: #E8673A;
  --terracotta: #C4622D;
  --olive: #7A7A2A;
  --olive-light: #A8A840;
  --brown: #6B4226;
  --brown-light: #9A6845;
  --gold: #C9961A;
  --text-dark: #2C1A0A;
  --text-mid: #5C3D1E;
  --text-light: #8A6540;
  --border: #E8D5B0;
  --shadow: rgba(160, 98, 15, 0.15);
  --tag-emotion: #E8673A;
  --tag-vocab: #D4821A;
  --tag-academic: #7A7A2A;
  --tag-arts: #9B59B6;
  --tag-society: #2980B9;
  --tag-economy: #16A085;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Lora', 'Noto Serif TC', serif;
  background: var(--warm-bg);
  color: var(--text-dark);
  min-height: 100vh;
  background-image: 
    radial-gradient(ellipse at 20% 10%, rgba(212,130,26,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(193,68,14,0.06) 0%, transparent 50%);
}

/* HEADER */
.site-header {
  background: linear-gradient(135deg, #8B3A10 0%, #C1440E 30%, #D4821A 60%, #C9961A 100%);
  color: white;
  padding: 40px 24px 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(139,58,16,0.4);
}
.site-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 40px,
    rgba(255,255,255,0.03) 40px,
    rgba(255,255,255,0.03) 80px
  );
}
.site-header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.6rem, 4vw, 2.8rem);
  font-weight: 900;
  letter-spacing: 0.02em;
  text-shadow: 2px 3px 8px rgba(0,0,0,0.3);
  position: relative;
}
.site-header .subtitle {
  font-family: 'Noto Serif TC', serif;
  font-size: 1rem;
  margin-top: 8px;
  opacity: 0.9;
  position: relative;
}
.header-badge {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 20px;
  padding: 4px 16px;
  font-size: 0.85rem;
  margin-top: 10px;
  position: relative;
  backdrop-filter: blur(4px);
}

/* CONTROLS */
.controls {
  background: var(--cream);
  border-bottom: 2px solid var(--border);
  padding: 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px var(--shadow);
}
.controls-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  border: 2px solid var(--border);
  border-radius: 30px;
  background: white;
  font-family: 'Lora', serif;
  font-size: 0.95rem;
  color: var(--text-dark);
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--amber); }
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  color: var(--text-light);
}
.filter-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tab-btn {
  padding: 7px 16px;
  border: 2px solid transparent;
  border-radius: 20px;
  font-family: 'Noto Serif TC', serif;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: white;
  color: var(--text-mid);
  border-color: var(--border);
}
.tab-btn:hover { border-color: var(--amber); color: var(--amber-dark); }
.tab-btn.active {
  background: var(--amber);
  border-color: var(--amber);
  color: white;
}
.count-badge {
  background: var(--rust);
  color: white;
  border-radius: 10px;
  padding: 2px 8px;
  font-size: 0.75rem;
  font-weight: 700;
  margin-left: 6px;
}

/* MAIN */
.main { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }

.unit-section {
  margin-bottom: 40px;
}
.unit-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  color: var(--rust);
  border-left: 5px solid var(--amber);
  padding-left: 14px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.unit-count { font-size: 0.9rem; color: var(--text-light); font-family: 'Lora', serif; font-weight: normal; }

.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
}

/* CARD */
.vocab-card {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 3px 12px var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}
.vocab-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--amber), var(--rust));
  border-radius: 16px 16px 0 0;
}
.vocab-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(160,98,15,0.2);
}

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.word-main {
  flex: 1;
}
.word-en {
  font-family: 'Playfair Display', serif;
  font-size: 1.45rem;
  font-weight: 700;
  color: var(--rust);
  line-height: 1.2;
}
.word-zh {
  font-family: 'Noto Serif TC', serif;
  font-size: 0.9rem;
  color: var(--text-mid);
  margin-top: 3px;
}
.word-pos {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--amber);
  color: white;
  border-radius: 8px;
  padding: 3px 10px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 4px;
}

/* DERIVATION */
.deriv-section {
  background: linear-gradient(135deg, #FFF4E6, #FFF8EE);
  border: 1px solid #F0D8A8;
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 14px;
}
.deriv-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--olive);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.deriv-items {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.deriv-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: white;
  border: 1.5px solid #E8C87A;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 0.8rem;
}
.deriv-word { font-weight: 700; color: var(--brown); font-family: 'Lora', serif; font-style: italic; }
.deriv-pos { font-size: 0.68rem; color: var(--olive); font-weight: 600; }
.deriv-zh { font-size: 0.75rem; color: var(--text-mid); font-family: 'Noto Serif TC', serif; }

/* EXAMPLES */
.examples-section { }
.ex-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--terracotta);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.example-item {
  background: rgba(212,130,26,0.05);
  border-left: 3px solid var(--amber-light);
  border-radius: 0 8px 8px 0;
  padding: 8px 12px;
  margin-bottom: 8px;
}
.example-item:last-child { margin-bottom: 0; }
.ex-en {
  font-size: 0.88rem;
  color: var(--text-dark);
  line-height: 1.5;
  margin-bottom: 3px;
}
.ex-en em { color: var(--rust); font-style: italic; font-weight: 600; }
.ex-zh {
  font-size: 0.82rem;
  color: var(--text-mid);
  font-family: 'Noto Serif TC', serif;
  line-height: 1.5;
}

/* hidden */
.vocab-card.hidden { display: none; }

/* no results */
.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
  font-size: 1.1rem;
  display: none;
}
.no-results.show { display: block; }

/* stats bar */
.stats-bar {
  text-align: right;
  font-size: 0.82rem;
  color: var(--text-light);
  margin-bottom: 16px;
  font-family: 'Noto Serif TC', serif;
}
.stats-bar strong { color: var(--amber-dark); }

footer {
  text-align: center;
  padding: 24px;
  color: var(--text-light);
  font-size: 0.82rem;
  border-top: 1px solid var(--border);
  font-family: 'Noto Serif TC', serif;
}

@media (max-width: 600px) {
  .vocab-grid { grid-template-columns: 1fr; }
  .controls-inner { flex-direction: column; }
  .filter-tabs { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
}
</style>
</head>

</nav>

let currentSearch = '';

function buildCards() {
  const main = document.getElementById('mainContent');
  // Remove old sections
  main.querySelectorAll('.unit-section').forEach(s => s.remove());

  units.forEach(unit => {
    const section = document.createElement('div');
    section.className = 'unit-section';
    section.dataset.unit = unit;
    
    const words = VOCAB.filter(v => v.unit === unit);
    const title = document.createElement('div');
    title.className = 'unit-title';
    title.innerHTML = `${unitNames[unit]} <span class="unit-count">(${words.length} 個單字)</span>`;
    section.appendChild(title);
    
    const grid = document.createElement('div');
    grid.className = 'vocab-grid';
    
    words.forEach(v => {
      const card = document.createElement('div');
      card.className = 'vocab-card';
      card.dataset.unit = v.unit;
      card.dataset.word = v.word.toLowerCase();
      card.dataset.zh = v.zh;

      // Deriv HTML
      const derivHTML = v.deriv.map(d =>
        `<span class="deriv-chip"><span class="deriv-pos">${d.pos}</span><span class="deriv-word">${d.w}</span><span class="deriv-zh">${d.zh}</span></span>`
      ).join('');

      // Examples HTML
      const exHTML = v.ex.map(e =>
        `<div class="example-item"><div class="ex-en">${e.en}</div><div class="ex-zh">${e.zh}</div></div>`
      ).join('');

      card.innerHTML = `
        <div class="card-header">
          <div class="word-main">
            <div class="word-en">${v.word}</div>
            <div class="word-zh">${v.zh}</div>
          </div>
          <span class="word-pos">${v.pos}</span>
        </div>
        <div class="deriv-section">
          <div class="deriv-label">衍生詞 / 片語</div>
          <div class="deriv-items">${derivHTML}</div>
        </div>
        <div class="examples-section">
          <div class="ex-label">例句</div>
          ${exHTML}
        </div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    main.appendChild(section);
  });

  updateCounts();
}

function updateCounts() {
  const allCards = document.querySelectorAll('.vocab-card');
  document.getElementById('cnt-all').textContent = allCards.length;
  units.forEach(u => {
    const cnt = VOCAB.filter(v=>v.unit===u).length;
    document.getElementById(`cnt-${u.replace('-','')}`).textContent = cnt;
  });
}

function filterUnit(unit) {
  currentUnit = unit;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  applyFilters();
}

function filterCards() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase().trim();
  applyFilters();
}

function applyFilters() {
  const sections = document.querySelectorAll('.unit-section');
  sections.forEach(section => {
    const sectionUnit = section.dataset.unit;
    const unitMatch = currentUnit === 'all' || sectionUnit === currentUnit;
    section.style.display = unitMatch ? '' : 'none';
  });

  const cards = document.querySelectorAll('.vocab-card');
  let visible = 0;
  cards.forEach(card => {
    const unitMatch = currentUnit === 'all' || card.dataset.unit === currentUnit;
    const searchMatch = !currentSearch ||
      card.dataset.word.includes(currentSearch) ||
      card.dataset.zh.includes(currentSearch);
    const show = unitMatch && searchMatch;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });

  document.getElementById('visibleCount').textContent = visible;
  document.getElementById('noResults').classList.toggle('show', visible === 0 && currentSearch !== '');
}

buildCards();
</script>
</body>
</html>
